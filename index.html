<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zerde-FAQ QR Code</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Apple Face ID smooth transition for QR container */
        #qrImage, #successOverlay {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 md:p-8 relative overflow-x-hidden">

    <!-- Hidden Audio Elements -->
    <audio id="audio1" src="audio_1.mp3" preload="auto"></audio>
    <audio id="audio2" src="audio_2.mp3" preload="auto"></audio>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 left-5 sm:left-auto z-50 transform translate-y-[-150%] opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center space-x-3 text-sm font-medium">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-message" class="truncate">Сәтті орындалды!</span>
    </div>

    <!-- Top Bar: Back Button -->
    <header class="w-full max-w-xl mx-auto flex justify-start items-center">
        <a href="index.html" class="animate-fade-in-up delay-1 inline-flex items-center px-4 py-2.5 bg-white hover:bg-slate-50 text-slate-700 font-medium rounded-xl shadow-sm border border-slate-200 transition-all duration-200 hover:shadow active:scale-95">
            <i class="fa-solid fa-arrow-left mr-2 text-sm"></i> Кері
        </a>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-xl mx-auto my-auto py-6 flex flex-col items-center text-center">
        
        <!-- Top Heading -->
        <h1 class="animate-fade-in-up delay-2 text-xl sm:text-2xl font-bold text-slate-800 mb-6 sm:mb-8 max-w-lg leading-snug px-2">
            Бұл — басқалар сайтты таба алуы үшін арналған QR код.
        </h1>

        <!-- QR Code Container Card with Face ID Success Animation Overlay -->
        <div class="animate-fade-in-up delay-3 glass-card p-6 rounded-3xl shadow-xl mb-6 sm:mb-8 relative overflow-hidden">
            <img id="qrImage" src="qr.png" 
                 onerror="this.onerror=null; this.src='https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://Zerde-FAQ.github.io';" 
                 alt="QR Code" 
                 class="w-52 h-52 sm:w-64 sm:h-64 object-contain rounded-2xl mx-auto border border-slate-100 shadow-inner">
            
            <!-- Face ID Success Overlay (Hidden by default) -->
            <div id="successOverlay" class="absolute inset-0 bg-white/95 backdrop-blur-md rounded-3xl flex flex-col items-center justify-center opacity-0 pointer-events-none scale-90">
                <div id="checkCircle" class="w-20 h-20 sm:w-24 sm:h-24 bg-emerald-500 text-white rounded-full flex items-center justify-center shadow-lg shadow-emerald-500/30 transform scale-50 transition-transform duration-500">
                    <i class="fa-solid fa-check text-4xl sm:text-5xl"></i>
                </div>
                <span id="overlayText" class="mt-3 text-sm font-semibold text-slate-700 opacity-0 transition-opacity duration-300">Сәтті көшірілді!</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="animate-fade-in-up delay-4 flex flex-col sm:flex-row items-center justify-center gap-3.5 w-full max-w-md mb-6 sm:mb-8 px-2">
            <!-- Blue Share Button -->
            <button id="shareBtn" onclick="shareQRCode()" class="w-full sm:w-1/2 flex items-center justify-center py-3.5 px-6 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-semibold rounded-2xl shadow-lg shadow-blue-500/25 transition-all duration-200 active:scale-95 cursor-pointer">
                <i class="fa-solid fa-share-nodes mr-2 text-lg"></i> Бөлісу
            </button>
            
            <!-- Green Copy Button -->
            <button id="copyBtn" onclick="copyQRCode()" class="w-full sm:w-1/2 flex items-center justify-center py-3.5 px-6 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-700 hover:to-emerald-600 text-white font-semibold rounded-2xl shadow-lg shadow-emerald-500/25 transition-all duration-200 active:scale-95 cursor-pointer">
                <i class="fa-solid fa-copy mr-2 text-lg"></i> Көшіру
            </button>
        </div>

        <!-- Bottom Descriptive Text -->
        <p class="animate-fade-in-up delay-4 text-xs sm:text-sm text-slate-500 max-w-md leading-relaxed px-4">
            Қажет болса, біз Сізге сайтқа сілтеме бере аламыз. Сондай-ақ, сіз QR кодты немесе сілтемени көшіріп ала аласыз.
        </p>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-xl mx-auto text-center py-2">
        <a href="https://Zerde-FAQ.github.io" target="_blank" class="inline-flex items-center text-xs sm:text-sm font-medium text-slate-600 hover:text-blue-600 transition-colors">
            <i class="fa-solid fa-paperclip mr-1.5 text-slate-400"></i> Zerde-FAQ.github.io
        </a>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Toast Notification Function
        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');
            
            toastMessage.textContent = message;
            toastIcon.className = isSuccess ? "fa-solid fa-circle-check text-emerald-400 text-lg" : "fa-solid fa-circle-exclamation text-amber-400 text-lg";
            
            toast.classList.remove('translate-y-[-150%]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-150%]', 'opacity-0');
            }, 3500);
        }

        // Apple Face ID Style Smooth Animation
        function triggerFaceIdAnimation(messageText, callback) {
            const qrImg = document.getElementById('qrImage');
            const overlay = document.getElementById('successOverlay');
            const checkCircle = document.getElementById('checkCircle');
            const overlayText = document.getElementById('overlayText');

            // 1. QR shrinks and recedes smoothly
            qrImg.style.transform = 'scale(0.8)';
            qrImg.style.opacity = '0';
            
            // Show overlay & checkmark with scale up
            overlay.classList.remove('opacity-0', 'pointer-events-none', 'scale-90');
            overlay.classList.add('opacity-100', 'scale-100');
            
            setTimeout(() => {
                checkCircle.classList.remove('scale-50');
                checkCircle.classList.add('scale-100');
                overlayText.textContent = messageText;
                overlayText.classList.remove('opacity-0');
                overlayText.classList.add('opacity-100');
            }, 100);

            // 2. Return back to normal after 1.3 seconds smoothly
            setTimeout(() => {
                checkCircle.classList.remove('scale-100');
                checkCircle.classList.add('scale-50');
                overlayText.classList.remove('opacity-100');
                overlayText.classList.add('opacity-0');
                
                overlay.classList.remove('opacity-100', 'scale-100');
                overlay.classList.add('opacity-0', 'pointer-events-none', 'scale-90');
                
                qrImg.style.transform = 'scale(1)';
                qrImg.style.opacity = '1';

                if (callback) callback();
            }, 1400);
        }

        // Share QR Code (Robust for Mobile & Windows PC)
        async function shareQRCode() {
            const imgElement = document.getElementById('qrImage');
            const imgSrc = imgElement.src;

            try {
                const response = await fetch(imgSrc);
                const blob = await response.blob();
                const file = new File([blob], 'qr.png', { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'Zerde-FAQ QR Code',
                        text: 'Бұл — басқалар сайтты таба алуы үшін арналған QR код.',
                        files: [file]
                    });
                } else if (navigator.share) {
                    await navigator.share({
                        title: 'Zerde-FAQ QR Code',
                        text: 'Бұл — басқалар сайтты таба алуы үшін арналған QR код.',
                        url: window.location.href
                    });
                } else {
                    // Windows browser fallback friendly hint
                    showToast("Компьютерде файлмен бөлісу қолжетімсіз, бірақ «Көшіру» батырмасын қолдана аласыз! 💻", false);
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.log("Share handled or unsupported:", error);
                    showToast("Бұл құрылғыда бөлісу шектелген. «Көшіру» батырмасын көріңіз.", false);
                }
            }
        }

        // Copy QR Code image to clipboard with Face ID Animation
        async function copyQRCode() {
            const imgElement = document.getElementById('qrImage');
            const imgSrc = imgElement.src;

            try {
                const response = await fetch(imgSrc);
                const blob = await response.blob();
                
                if (navigator.clipboard && window.ClipboardItem) {
                    await navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]);
                    
                    // Trigger Apple Face ID success animation
                    triggerFaceIdAnimation("qr.png көшірілді!", () => {
                        showToast("qr.png буфер алмасу жадына сәтті көшірілді!");
                    });
                } else {
                    showToast("Шолғышыңыз кескінді көшіруді қолдамайды.", false);
                }
            } catch (error) {
                console.error("Copy error:", error);
                showToast("Көшіру кезінде қате орын алды.", false);
            }
        }

        // Audio Playback Sequence Logic
        window.addEventListener('load', () => {
            const audio1 = document.getElementById('audio1');
            const audio2 = document.getElementById('audio2');

            // 1 second after QR code and elements appear (approx 1.5s total delay after load)
            setTimeout(() => {
                audio1.play().then(() => {
                    console.log("audio_1.mp3 playing...");
                }).catch(err => {
                    console.log("Autoplay waiting for user interaction:", err);
                    const unlockAudio = () => {
                        audio1.play().catch(() => {});
                        document.removeEventListener('click', unlockAudio);
                        document.removeEventListener('touchstart', unlockAudio);
                    };
                    document.addEventListener('click', unlockAudio);
                    document.addEventListener('touchstart', unlockAudio);
                });
            }, 1500);

            // 0.5s after audio_1 completely finishes, play audio_2
            audio1.onended = () => {
                console.log("audio_1 finished. Playing audio_2 in 500ms...");
                setTimeout(() => {
                    audio2.play().catch(err => {
                        console.log("audio_2 autoplay failed:", err);
                    });
                }, 500);
            };

            // Fallback synthetic audio if physical mp3 files are missing during testing
            audio1.onerror = () => {
                console.log("audio_1.mp3 missing in local folder, using fallback timer.");
            };
        });
    </script>
</body>
</html>
