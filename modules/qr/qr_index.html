<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zerde-FAQ QR Code</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Защита от выделения текста и контента */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #ffffff; /* Чисто белый фон */
            color: #1e293b;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        /* Clean White Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.06);
        }

        /* Massive Rotating Ornament with White Chromakey Removal */
        @keyframes spinOrnament {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .rotating-ornament {
            animation: spinOrnament 40s linear infinite;
            mix-blend-mode: multiply; /* Хромакей белого фона */
            filter: contrast(110%);
        }

        /* Smooth Fullscreen Loading Curtain */
        #loadingCurtain {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }
        #loadingCurtain.active {
            opacity: 1;
            pointer-events: auto;
        }

        #f12Modal {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 md:p-8 relative overflow-x-hidden">

    <!-- Soft Background Music (km.wav, 20% volume) -->
    <audio id="bgMusic" src="../../km.wav" loop preload="auto"></audio>

    <!-- Smooth Fullscreen Loading Curtain -->
    <div id="loadingCurtain" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
        <span class="text-slate-600 text-sm font-medium tracking-wide">Жүктелуде...</span>
    </div>

    <!-- Protected Modal Warning (F12 Lock) -->
    <div id="f12Modal" class="fixed inset-0 z-50 bg-slate-900/30 backdrop-blur-md flex items-center justify-center opacity-0 pointer-events-none p-4">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-slate-100 text-center transform scale-90 transition-all duration-300">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2">Қорғалған жүйе</h3>
            <p class="text-sm text-slate-600 leading-relaxed font-medium mb-6">Бастапқы код жабық. Хабарлама 3 секундтан кейін жабылады...</p>
            <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                <div id="modalProgress" class="bg-blue-600 h-full w-full transition-all duration-3000 ease-linear rounded-full"></div>
            </div>
        </div>
    </div>

    <!-- Extra Large Rotating Kazakh Ornament (ojy.jpg) -->
    <div class="fixed -bottom-24 -left-24 sm:-bottom-32 sm:-left-32 md:-bottom-40 md:-left-40 z-0 pointer-events-none opacity-75">
        <img src="../../ojy.jpg" alt="Қазақ орнаменті" class="w-[350px] h-[350px] sm:w-[500px] sm:h-[500px] md:w-[650px] md:h-[650px] object-contain rotating-ornament" onerror="this.style.display='none';">
    </div>

    <!-- Hidden Audio Elements -->
    <audio id="audio1" src="audio_1.mp3" preload="auto"></audio>
    <audio id="audio2" src="audio_2.mp3" preload="auto"></audio>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-y-[-150%] opacity-0 transition-all duration-300 bg-white/95 backdrop-blur-md text-slate-800 border border-slate-200/80 px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 text-sm font-medium">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-500 text-lg"></i>
        <span id="toast-message">Сәтті орындалды!</span>
    </div>

    <!-- Top Bar: Back Button -->
    <header class="w-full max-w-xl mx-auto flex justify-start items-center relative z-10">
        <button onclick="goBack(event)" class="animate-fade-in-up delay-1 inline-flex items-center px-4 py-2 bg-white hover:bg-slate-50 text-slate-700 font-medium rounded-xl shadow-sm border border-slate-200 transition-all duration-200 hover:shadow cursor-pointer">
            <i class="fa-solid fa-arrow-left mr-2 text-sm"></i> Кері
        </button>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-xl mx-auto my-auto py-8 flex flex-col items-center text-center relative z-10">
        
        <!-- Top Heading -->
        <h1 class="animate-fade-in-up delay-2 text-xl sm:text-2xl font-bold text-slate-800 mb-8 max-w-lg leading-snug">
            Бұл — басқалар сайтты таба алуы үшін арналған QR код.
        </h1>

        <!-- QR Code Container Card -->
        <div class="animate-fade-in-up delay-3 glass-card p-6 rounded-3xl shadow-xl mb-8 transition-transform hover:scale-[1.01] duration-300">
            <img id="qrImage" src="qr.png" 
                 onerror="this.onerror=null; this.src='https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://Zerde-FAQ.github.io';" 
                 alt="QR Code" 
                 class="w-56 h-56 sm:w-64 sm:h-64 object-contain rounded-2xl mx-auto border border-slate-100 shadow-inner pointer-events-none">
        </div>

        <!-- Action Buttons -->
        <div class="animate-fade-in-up delay-4 flex flex-col sm:flex-row items-center justify-center gap-4 w-full max-w-md mb-8">
            <!-- Blue Share Button -->
            <button id="shareBtn" onclick="shareQRCode()" class="w-full sm:w-1/2 flex items-center justify-center py-3.5 px-6 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-semibold rounded-2xl shadow-lg shadow-blue-500/25 transition-all duration-200 active:scale-95 cursor-pointer">
                <i class="fa-solid fa-share-nodes mr-2 text-lg"></i> Бөлісу
            </button>
            
            <!-- Green Copy Button -->
            <button id="copyBtn" onclick="copyQRCode()" class="w-full sm:w-1/2 flex items-center justify-center py-3.5 px-6 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-700 hover:to-emerald-600 text-white font-semibold rounded-2xl shadow-lg shadow-emerald-500/25 transition-all duration-200 active:scale-95 cursor-pointer">
                <i class="fa-solid fa-copy mr-2 text-lg"></i> Көшіру
            </button>
        </div>

        <!-- Bottom Descriptive Text -->
        <p class="animate-fade-in-up delay-4 text-xs sm:text-sm text-slate-500 max-w-md leading-relaxed px-2">
            Қажет болса, біз Сізге сайтқа сілтеме бере аламыз. Сондай-ақ, сіз QR кодты немесе сілтемени көшіріп ала аласыз.
        </p>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-xl mx-auto text-center py-4 relative z-10">
        <a href="https://zerde-faq.github.io" target="_self" class="inline-flex items-center text-xs sm:text-sm font-medium text-slate-500 hover:text-blue-600 transition-colors">
            <i class="fa-solid fa-paperclip mr-1.5 text-slate-400"></i> zerde-faq.github.io
        </a>
    </footer>

    <!-- JavaScript Audio and Action Logic -->
    <script>
        // Start Background Music (km.wav) at 20% Volume
        window.addEventListener('load', () => {
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.volume = 0.2;
            
            const startMusic = () => {
                bgMusic.play().then(() => {
                    document.removeEventListener('click', startMusic);
                    document.removeEventListener('touchstart', startMusic);
                }).catch(() => {});
            };

            bgMusic.play().catch(() => {
                document.addEventListener('click', startMusic);
                document.addEventListener('touchstart', startMusic);
            });
        });

        // Smooth Back Button with Curtain Animation
        function goBack(event) {
            event.preventDefault();
            const curtain = document.getElementById('loadingCurtain');
            curtain.classList.add('active');

            setTimeout(() => {
                window.location.href = 'https://zerde-faq.github.io';
            }, 450);
        }

        // Custom Toast Notification Function
        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');
            
            toastMessage.textContent = message;
            toastIcon.className = isSuccess ? "fa-solid fa-circle-check text-emerald-500 text-lg" : "fa-solid fa-circle-exclamation text-amber-500 text-lg";
            
            toast.classList.remove('translate-y-[-150%]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-150%]', 'opacity-0');
            }, 3500);
        }

        // Share QR Code using Web Share API
        async function shareQRCode() {
            const imgElement = document.getElementById('qrImage');
            const imgSrc = imgElement.src;

            try {
                const response = await fetch(imgSrc);
                const blob = await response.blob();
                const file = new File([blob], 'qr.png', { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'Zerde-FAQ QR Code',
                        text: 'Бұл — басқалар сайтты таба алуы үшін арналған QR код.',
                        files: [file]
                    });
                } else if (navigator.share) {
                    await navigator.share({
                        title: 'Zerde-FAQ QR Code',
                        text: 'Бұл — басқалар сайтты таба алуы үшін арналған QR код.',
                        url: window.location.href
                    });
                } else {
                    showToast("Бұл құрылғыда бөлісу мүмкіндігі қолжетімсіз.", false);
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error("Share error:", error);
                    if (navigator.share) {
                        navigator.share({
                            title: 'Zerde-FAQ QR Code',
                            url: window.location.href
                        }).catch(() => {});
                    } else {
                        showToast("Бөлісу кезінде қате орын алды.", false);
                    }
                }
            }
        }

        // Copy QR Code image to clipboard
        async function copyQRCode() {
            const imgElement = document.getElementById('qrImage');
            const imgSrc = imgElement.src;

            try {
                const response = await fetch(imgSrc);
                const blob = await response.blob();
                
                if (navigator.clipboard && window.ClipboardItem) {
                    await navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]);
                    showToast("qr.png сәтті көшірілді!");
                } else {
                    showToast("Бұл шолғышта кескінді көшіруге шектеу қойылған.", false);
                }
            } catch (error) {
                console.error("Copy error:", error);
                showToast("Көшіру кезінде қате орын алды.", false);
            }
        }

        // Audio Playback Sequence Logic
        window.addEventListener('load', () => {
            const audio1 = document.getElementById('audio1');
            const audio2 = document.getElementById('audio2');

            function createSynthAudio(frequency, duration) {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = frequency;
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    setTimeout(() => {
                        osc.stop();
                        audioCtx.close();
                    }, duration);
                } catch (e) {
                    console.log("Web audio synth fallback error", e);
                }
            }

            setTimeout(() => {
                audio1.play().then(() => {
                    console.log("audio_1.mp3 playing...");
                }).catch(err => {
                    console.log("Autoplay blocked, waiting for user interaction...", err);
                    const unlockAudio = () => {
                        audio1.play().catch(() => {});
                        document.removeEventListener('click', unlockAudio);
                        document.removeEventListener('touchstart', unlockAudio);
                    };
                    document.addEventListener('click', unlockAudio);
                    document.addEventListener('touchstart', unlockAudio);
                });
            }, 1500);

            audio1.onended = () => {
                console.log("audio_1 finished. Playing audio_2 in 500ms...");
                setTimeout(() => {
                    audio2.play().catch(err => {
                        console.log("audio_2 autoplay failed:", err);
                    });
                }, 500);
            };

            audio1.onerror = () => {
                console.log("audio_1.mp3 not found, using synth fallback.");
                setTimeout(() => {
                    createSynthAudio(440, 1000);
                    setTimeout(() => {
                        setTimeout(() => {
                            createSynthAudio(660, 1000);
                        }, 500);
                    }, 1000);
                }, 1500);
            };
        });

        // Copy / Drag / Context Menu Protection
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        // F12 & DevTools Protection
        let isModalActive = false;
        function triggerF12Warning() {
            if (isModalActive) return;
            isModalActive = true;

            const modal = document.getElementById('f12Modal');
            const progressBar = document.getElementById('modalProgress');

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100');
            modal.querySelector('div').classList.remove('scale-90');
            modal.querySelector('div').classList.add('scale-100');

            progressBar.style.width = '100%';
            setTimeout(() => {
                progressBar.style.width = '0%';
            }, 50);

            setTimeout(() => {
                modal.classList.remove('opacity-100');
                modal.classList.add('opacity-0', 'pointer-events-none');
                modal.querySelector('div').classList.remove('scale-100');
                modal.querySelector('div').classList.add('scale-90');
                isModalActive = false;
            }, 3000);
        }

        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
            ) {
                e.preventDefault();
                triggerF12Warning();
            }
        });
    </script>
</body>
</html>
